<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" fill="none">
  <title>Vesqen Twin Paths construction</title>
  <rect width="720" height="520" rx="28" fill="#F6F7F2"/>
  <text x="48" y="66" fill="#1B1C18" font-family="Roboto, sans-serif" font-size="28" font-weight="600">Twin Paths construction</text>
  <text x="48" y="96" fill="#5E6056" font-family="Roboto, sans-serif" font-size="15">108-unit master grid · vertical symmetry · adaptive-icon safe zone</text>
  <g transform="translate(110 120) scale(2.65)">
    <rect width="108" height="108" rx="4" stroke="#C8C9BE" stroke-width=".8"/>
    <rect x="21" y="21" width="66" height="66" rx="3" fill="#9FBF4B" fill-opacity=".08" stroke="#9FBF4B" stroke-width=".8" stroke-dasharray="3 3"/>
    <path d="M54 8V100" stroke="#536B1E" stroke-width=".6" stroke-dasharray="2 2"/>
    <path d="M29 32L54 78L79 32" stroke="#1B1C18" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M39 32L54 60L69 32" stroke="#9FBF4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Roboto, sans-serif">
    <text x="430" y="164" fill="#1B1C18" font-size="16" font-weight="600">Outer path</text>
    <text x="430" y="190" fill="#5E6056" font-size="14">M29,32 → 54,78 → 79,32</text>
    <text x="430" y="232" fill="#1B1C18" font-size="16" font-weight="600">Inner path</text>
    <text x="430" y="258" fill="#5E6056" font-size="14">M39,32 → 54,60 → 69,32</text>
    <text x="430" y="300" fill="#1B1C18" font-size="16" font-weight="600">Safe zone</text>
    <text x="430" y="326" fill="#5E6056" font-size="14">66 × 66 · x/y 21–87</text>
    <text x="430" y="368" fill="#1B1C18" font-size="16" font-weight="600">Clear space</text>
    <text x="430" y="394" fill="#5E6056" font-size="14">Minimum 14 units on all sides</text>
    <text x="48" y="480" fill="#5E6056" font-size="14">Never rotate, skew, add a tail, or change the shared centre axis.</text>
  </g>
</svg>
