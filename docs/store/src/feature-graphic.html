<!doctype html>
<!-- Play Store feature graphic (1024 × 500), in design direction B (docs/redesign/B_PAPER_AND_SOUND.md).
     Open with #en or #zh. The albums are the fictional samples from the website and tools/demo_library; never use real
     record covers. The card shows the file, decoder and route but no output state: store art must not suggest an
     unverified bit-perfect claim. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=Noto+Serif+SC:wght@400&display=block">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; background: #F3EFE6; color: #1A1A16; font-family: "Instrument Sans", "PingFang SC", sans-serif; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .frame { position: relative; width: 1024px; height: 500px; }
  .brand { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 12px; min-height: 44px; }
  .brand span { font-family: "Instrument Serif", Georgia, serif; font-size: 34px; line-height: 1; }
  .eyebrow { position: absolute; left: 66px; top: 138px; font-size: 15px; font-weight: 500; letter-spacing: 0.16em; color: #5E5A50; }
  h1 { position: absolute; left: 62px; top: 168px; margin: 0; font-family: "Instrument Serif", "Noto Serif SC", Georgia, serif; font-weight: 400; font-size: 76px; line-height: 0.98; letter-spacing: -0.01em; }
  h1 > span { display: block; }
  .accent { color: #536B1E; }
  .stack { position: absolute; left: 570px; top: 40px; width: 400px; height: 410px; }
  .cover { position: absolute; width: 270px; height: 270px; border-radius: 4px; box-shadow: 0 18px 40px rgba(40, 32, 18, 0.18); }
  .cover svg { display: block; width: 100%; height: 100%; }
  .card { position: absolute; left: 140px; top: 168px; width: 268px; padding: 18px 20px 16px; background: #FBF9F4; border-radius: 6px; box-shadow: 0 16px 36px rgba(40, 32, 18, 0.16); }
  .card-title { margin-bottom: 10px; font-family: "Instrument Serif", "Noto Serif SC", Georgia, serif; font-size: 24px; }
  .card-track { font-family: "Instrument Serif", Georgia, serif; font-size: 19px; }
  .card-meta { margin: 2px 0 8px; font-size: 12px; color: #5E5A50; }
  .card-row { display: grid; grid-template-columns: 62px 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid #D8D1C1; font-size: 13px; white-space: nowrap; }
  .card-row span:first-child { color: #5E5A50; }
  /* Chinese: larger leading and wider tracking (B spec §3). */
  .zh h1 { top: 172px; font-size: 64px; line-height: 1.16; letter-spacing: 0.02em; }
  .zh .eyebrow { letter-spacing: 0.24em; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="brand">
    <svg width="40" height="40" viewBox="18 22 72 64" fill="none" aria-hidden="true">
      <path d="M29 32L54 78L79 32" stroke="#1B1C18" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M39 32L54 60L69 32" stroke="#9FBF4B" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Vesqen</span>
  </div>
  <div class="eyebrow" data-en="AN OFFLINE MUSIC PLAYER FOR ANDROID" data-zh="Android 离线音乐播放器"></div>
  <h1>
    <span data-en="Every track" data-zh="每首歌，"></span>
    <span data-en="comes with" data-zh="都有一份"></span>
    <span class="accent" data-en="liner notes." data-zh="链路注记。"></span>
  </h1>
  <div class="stack">
    <div class="cover" style="left: 128px; top: 8px; transform: rotate(5deg);">
      <svg viewBox="0 0 380 380"><rect width="380" height="380" fill="#B1613A"/><circle cx="0" cy="380" r="236" fill="none" stroke="#1B1512" stroke-width="64"/><rect x="270" y="46" width="64" height="64" fill="#F0E2CB"/><circle cx="300" cy="298" r="10" fill="#1B1512"/><text x="28" y="46" fill="#1B1512" font-size="13" letter-spacing="2.6" font-family="sans-serif">OTIS VALE QUARTET</text><text x="334" y="142" fill="#1B1512" font-size="13" letter-spacing="2.6" text-anchor="end" font-family="sans-serif">COPPER HOURS</text></svg>
    </div>
    <div class="cover" style="left: 70px; top: 30px; transform: rotate(-3deg);">
      <svg viewBox="0 0 380 380"><rect width="380" height="380" fill="#D8DBD2"/><circle cx="262" cy="140" r="50" fill="#F5F3EC"/><rect y="232" width="380" height="148" fill="#C8CCC2"/><rect y="231" width="380" height="2" fill="#23241F"/><rect x="70" y="194" width="4" height="38" fill="#23241F"/><rect x="94" y="203" width="4" height="29" fill="#23241F"/><rect x="118" y="210" width="4" height="22" fill="#23241F"/><rect x="70" y="235" width="4" height="30" fill="#23241F" opacity="0.22"/><rect x="94" y="235" width="4" height="22" fill="#23241F" opacity="0.22"/><rect x="118" y="235" width="4" height="16" fill="#23241F" opacity="0.22"/><text x="28" y="48" fill="#23241F" font-size="16" letter-spacing="4" font-family="sans-serif">林汐</text><text x="28" y="350" fill="#23241F" font-size="16" letter-spacing="4" font-family="sans-serif">盐与雾</text></svg>
    </div>
    <div class="cover" style="left: 0; top: 56px;">
      <svg viewBox="0 0 380 380"><rect width="380" height="380" fill="#1D4442"/><circle cx="190" cy="176" r="96" fill="#E8DFC8"/><rect y="206" width="380" height="174" fill="#1D4442"/><rect x="104" y="222" width="172" height="5" rx="2.5" fill="#E8DFC8" opacity="0.75"/><rect x="126" y="239" width="128" height="4" rx="2" fill="#E8DFC8" opacity="0.55"/><rect x="148" y="254" width="84" height="3" rx="1.5" fill="#E8DFC8" opacity="0.4"/><rect x="168" y="267" width="44" height="2" rx="1" fill="#E8DFC8" opacity="0.28"/><text x="28" y="46" fill="#E8DFC8" font-size="13" letter-spacing="2.6" font-family="sans-serif">MAREN HOLT</text><text x="28" y="350" fill="#E8DFC8" font-size="13" letter-spacing="2.6" opacity="0.8" font-family="sans-serif">LOW TIDE ARCHIVE</text></svg>
    </div>
    <div class="card">
      <div class="card-title" data-en="Liner notes" data-zh="链路注记"></div>
      <div class="card-track">Glass Harbor</div>
      <div class="card-meta">Maren Holt — Low Tide Archive</div>
      <div class="card-row"><span data-en="File" data-zh="文件"></span><span>FLAC · 24-bit · 96 kHz</span></div>
      <div class="card-row"><span data-en="Decoder" data-zh="解码器"></span><span data-en="Android FLAC decoder" data-zh="Android FLAC 解码器"></span></div>
      <div class="card-row"><span data-en="Route" data-zh="路由"></span><span data-en="USB audio · external DAC" data-zh="USB 音频 · 外接 DAC"></span></div>
    </div>
  </div>
</div>
<script>
  const language = location.hash === "#zh" ? "zh" : "en";
  document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
  document.getElementById("frame").classList.toggle("zh", language === "zh");
  for (const element of document.querySelectorAll("[data-en]")) element.textContent = element.dataset[language];
</script>
</body>
</html>
