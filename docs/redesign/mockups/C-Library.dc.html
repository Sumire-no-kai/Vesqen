<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>动态版式 · 曲库</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDEDE6}
a{color:#0F0F0E}a:hover{color:#0F0F0E}
button:focus-visible,a:focus-visible{outline:3px solid #0F0F0E;outline-offset:2px}
button:disabled{cursor:default}
.pop{animation:pop .5s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.list-in{animation:listin .45s cubic-bezier(.16,1,.3,1)}
@keyframes listin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.key{transition:background-color .2s ease,color .2s ease,border-color .2s ease}
.key:not(:disabled):hover{border-color:#0F0F0E !important}
.icon-btn{transition:background-color .2s ease}
.icon-btn:hover{background-color:rgba(15,15,14,.07) !important}
.scroller{scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){.pop,.list-in{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background-color: #EDEDE6; color: #0F0F0E; font-family: 'Hanken Grotesk', 'Noto Sans SC', system-ui, sans-serif">
<div style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0; padding-top: 44px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 12px 0 22px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Noto Sans SC', sans-serif; font-size: 64px; line-height: 1; font-weight: 900; letter-spacing: -0.02em">曲库</h1>
<div style="display: flex; gap: 2px; padding-bottom: 6px">
<button class="icon-btn" aria-label="搜索本地音乐" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background-color: transparent; color: #0F0F0E; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13z"></path><path d="m20 20-4.8-4.8"></path></svg></button>
<button class="icon-btn" aria-label="曲库排序" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background-color: transparent; color: #0F0F0E; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16"></path><path d="m4 17 3 3 3-3"></path><path d="M17 20V4"></path><path d="m14 7 3-3 3 3"></path></svg></button>
</div>
</div>
<div class="scroller" role="tablist" aria-label="曲库视图" style="display: flex; gap: 6px; margin-top: 12px; padding: 0 16px; overflow-x: auto">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="6">
<button role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="flex-shrink: 0; min-height: 44px; padding: 0 10px; border: 0; border-radius: 4px; background-color: {{tb.bg}}; color: #0F0F0E; font-family: 'Hanken Grotesk', 'Noto Sans SC', sans-serif; font-size: 17px; font-weight: {{tb.weight}}; cursor: pointer">{{tb.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="按首字母筛选" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin-top: 14px; padding: 0 22px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="27">
<button class="key" onClick="{{k.pick}}" disabled="{{k.off}}" aria-pressed="{{k.sel}}" style="height: 44px; padding: 0; border: 1.5px solid {{k.border}}; border-radius: 6px; background-color: {{k.bg}}; color: {{k.fg}}; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700; cursor: pointer">{{k.l}}</button>
</sc-for>
</div>
<sc-if value="{{flipA}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 14px; flex-grow: 1; min-height: 0; margin-top: 16px; padding: 0 22px">
<span class="pop" aria-hidden="true" style="flex-shrink: 0; width: 96px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 128px; line-height: 0.8; font-weight: 800; letter-spacing: -0.05em">{{letter}}</span>
<div class="scroller list-in" style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; overflow-y: auto">
<sc-for list="{{items}}" as="it" hint-placeholder-count="2">
<button style="display: flex; flex-direction: column; justify-content: center; gap: 3px; width: 100%; min-height: 64px; padding: 6px 0; border: 0; border-bottom: 2px solid #0F0F0E; background-color: transparent; color: #0F0F0E; text-align: left; cursor: pointer; font-family: inherit">
<span style="font-family: 'Bricolage Grotesque', 'Noto Sans SC', sans-serif; font-size: 22px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">{{it.n}}</span>
<span style="font-size: 13px; color: #55554E">{{it.m}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{flipB}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 14px; flex-grow: 1; min-height: 0; margin-top: 16px; padding: 0 22px">
<span class="pop" aria-hidden="true" style="flex-shrink: 0; width: 96px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 128px; line-height: 0.8; font-weight: 800; letter-spacing: -0.05em">{{letter}}</span>
<div class="scroller list-in" style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; overflow-y: auto">
<sc-for list="{{items}}" as="it" hint-placeholder-count="2">
<button style="display: flex; flex-direction: column; justify-content: center; gap: 3px; width: 100%; min-height: 64px; padding: 6px 0; border: 0; border-bottom: 2px solid #0F0F0E; background-color: transparent; color: #0F0F0E; text-align: left; cursor: pointer; font-family: inherit">
<span style="font-family: 'Bricolage Grotesque', 'Noto Sans SC', sans-serif; font-size: 22px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">{{it.n}}</span>
<span style="font-size: 13px; color: #55554E">{{it.m}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
</div>
<div style="display: flex; align-items: center; gap: 12px; margin: 8px 12px 10px; padding: 8px; border-radius: 16px; background-color: #0F0F0E; color: #EDEDE6">
<a href="C-Now.dc.html" style="display: flex; align-items: center; gap: 12px; flex-grow: 1; min-width: 0; min-height: 48px; color: #EDEDE6; text-decoration: none">
<span style="display: flex; flex-shrink: 0; width: 44px; height: 44px; overflow: hidden"><svg viewBox="0 0 380 380" width="100%" height="100%" aria-hidden="true" style="display: block"><rect width="380" height="380" fill="#1D4442"></rect><circle cx="190" cy="176" r="96" fill="#E8DFC8"></circle><rect y="206" width="380" height="174" fill="#1D4442"></rect><rect x="104" y="222" width="172" height="5" rx="2.5" fill="#E8DFC8" opacity="0.75"></rect><rect x="126" y="239" width="128" height="4" rx="2" fill="#E8DFC8" opacity="0.55"></rect><rect x="148" y="254" width="84" height="3" rx="1.5" fill="#E8DFC8" opacity="0.4"></rect></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800; letter-spacing: -0.01em">Glass Harbor</span>
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #A3A39A">MAREN HOLT · SYSTEM MIXED</span>
</span>
</a>
<button aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 24px; background-color: #D3EE6A; color: #0F0F0E; cursor: pointer">
<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"></rect><rect x="13.5" y="5" width="4" height="14" rx="1.2"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.8v12.4c0 .8.9 1.3 1.6.9l10-6.2c.6-.4.6-1.4 0-1.8l-10-6.2C8.9 4.5 8 5 8 5.8z"></path></svg></sc-if>
</button>
</div>
<nav aria-label="主导航" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 80px; padding: 6px 8px 14px; box-sizing: border-box; background-color: #EDEDE6; border-top: 2px solid #0F0F0E">
<a href="C-Library.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #0F0F0E; font-size: 12px; font-weight: 800; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 15px; background-color: #0F0F0E; color: #EDEDE6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4v16"></path><path d="M10 4v16"></path><path d="m14.5 4.8 4.8 14.7"></path></svg></span>曲库</a>
<a href="C-Now.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #55554E; font-size: 12px; font-weight: 600; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 15px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"></rect><path d="M10 8.8v6.4l5.2-3.2z" fill="currentColor"></path></svg></span>正在播放</a>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; border: 0; background-color: transparent; color: #55554E; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 15px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="2.2"></circle><circle cx="12" cy="12" r="2.2"></circle><circle cx="19" cy="12" r="2.2"></circle><path d="M7.2 12h2.6M14.2 12h2.6"></path></svg></span>链路</button>
<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; border: 0; background-color: transparent; color: #55554E; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer"><span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 15px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg></span>设置</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  sets() {
    return {
      songs: { label: '歌曲', def: 'G', items: [
        { i: 'B', n: 'Brass Lantern', m: 'Otis Vale Quartet · 6:38' },
        { i: 'C', n: '潮间带', m: '林汐 · 3:33' },
        { i: 'D', n: '灯塔以北', m: '林汐 · 4:20' },
        { i: 'G', n: 'Glass Harbor', m: 'Maren Holt · 5:02' },
        { i: 'H', n: '候车室', m: '周屿 · 3:29' },
        { i: 'K', n: 'Kelp Forest', m: 'Maren Holt · 6:20' },
        { i: 'N', n: 'Night Transit', m: 'Kaede Lune · 4:55' },
        { i: 'S', n: 'Salt Flats', m: 'Ansel Brook · 7:12' },
        { i: 'S', n: 'Slow Furnace', m: 'Otis Vale Quartet · 5:12' },
        { i: 'U', n: 'Undertow', m: 'Maren Holt · 4:11' },
        { i: 'V', n: 'Verdigris', m: 'Otis Vale Quartet · 7:04' },
        { i: 'W', n: '晚风测绘', m: '林汐 · 3:47' }
      ] },
      albums: { label: '专辑', def: 'L', items: [
        { i: 'C', n: 'Copper Hours', m: 'Otis Vale Quartet · FLAC 16/44.1' },
        { i: 'F', n: 'Field Notes', m: 'Ansel Brook · WAV 24/192' },
        { i: 'G', n: 'Glasshouse', m: 'Mira Castell · FLAC 24/48' },
        { i: 'K', n: '空港', m: '周屿 · MP3 320k' },
        { i: 'L', n: 'Low Tide Archive', m: 'Maren Holt · FLAC 24/96' },
        { i: 'L', n: 'Late Bloom', m: 'Clara Montes · FLAC 16/44.1' },
        { i: 'N', n: 'Night Transit', m: 'Kaede Lune · AIFF 24/48' },
        { i: 'Y', n: '盐与雾', m: '林汐 · ALAC 24/48' }
      ] },
      artists: { label: '艺术家', def: 'M', items: [
        { i: 'A', n: 'Ansel Brook', m: 'Field Notes' },
        { i: 'A', n: 'Arlo Weiss', m: 'Paper Moons' },
        { i: 'B', n: '北岸合奏团', m: '潮汐手册' },
        { i: 'C', n: 'Clara Montes', m: 'Late Bloom' },
        { i: 'H', n: 'Hollis Grey', m: 'Quiet Engines' },
        { i: 'K', n: 'Kaede Lune', m: 'Night Transit' },
        { i: 'L', n: '林汐', m: '盐与雾' },
        { i: 'M', n: 'Maren Holt', m: 'Low Tide Archive' },
        { i: 'M', n: 'Mira Castell', m: 'Glasshouse' },
        { i: 'O', n: 'Otis Vale Quartet', m: 'Copper Hours' },
        { i: 'S', n: '沈听', m: '南方来信' },
        { i: 'T', n: 'Tessa Wren', m: 'Northbound' },
        { i: 'Y', n: '余白', m: '留白' },
        { i: 'Z', n: '周屿', m: '空港' }
      ] },
      folders: { label: '文件夹', def: 'M', items: [
        { i: 'D', n: 'Download', m: '内部存储' },
        { i: 'F', n: 'FLAC', m: 'SD 卡' },
        { i: 'M', n: 'Music', m: '内部存储' },
        { i: 'R', n: 'Recordings', m: 'SD 卡' }
      ] },
      genres: { label: '流派', def: 'J', items: [
        { i: 'D', n: '电子', m: 'Kaede Lune、Hollis Grey' },
        { i: 'F', n: '氛围', m: 'Maren Holt、Ansel Brook' },
        { i: 'G', n: '古典', m: 'Clara Montes' },
        { i: 'J', n: '爵士', m: 'Otis Vale Quartet' },
        { i: 'M', n: '民谣', m: '林汐、周屿' }
      ] },
      playlists: { label: '播放列表', def: 'S', items: [
        { i: 'S', n: '深夜', m: '18 首' },
        { i: 'S', n: '收藏的现场', m: '9 首' },
        { i: 'T', n: '通勤', m: '24 首' },
        { i: 'Z', n: '周末早晨', m: '12 首' }
      ] }
    };
  }
  renderVals() {
    const s = this.state || {};
    const sets = this.sets();
    const tab = s.tab ?? 'artists';
    const flip = s.flip ?? false;
    const playing = s.playing ?? true;
    const set = sets[tab];
    const avail = {};
    set.items.forEach((x) => { avail[x.i] = true; });
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
    const first = letters.filter((l) => avail[l])[0];
    const letter = s.letter && avail[s.letter] ? s.letter : (avail[set.def] ? set.def : first);
    const keys = letters.map((l) => {
      const on = !!avail[l];
      const sel = l === letter;
      return {
        l: l,
        off: !on,
        sel: sel,
        bg: sel ? '#0F0F0E' : 'transparent',
        fg: sel ? '#EDEDE6' : (on ? '#0F0F0E' : '#9C9C94'),
        border: sel ? '#0F0F0E' : (on ? '#B9B9B0' : 'transparent'),
        pick: () => { if (on && !sel) this.setState({ letter: l, flip: !flip }); }
      };
    });
    const tabs = Object.keys(sets).map((key) => ({
      label: sets[key].label,
      sel: key === tab,
      bg: key === tab ? '#D3EE6A' : 'transparent',
      weight: key === tab ? '800' : '500',
      pick: () => { if (key !== tab) this.setState({ tab: key, flip: !flip }); }
    }));
    return {
      tabs: tabs,
      keys: keys,
      letter: letter,
      items: set.items.filter((x) => x.i === letter),
      flipA: !flip,
      flipB: flip,
      playing: playing,
      paused: !playing,
      playLabel: playing ? '暂停' : '播放',
      togglePlay: () => this.setState({ playing: !playing })
    };
  }
}
</script>
</body>
</html>
