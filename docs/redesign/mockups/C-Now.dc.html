<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0F0E}
a{color:#D3EE6A}a:hover{color:#E4F59A}
button:focus-visible,a:focus-visible{outline:3px solid #D3EE6A;outline-offset:2px}
.outline{color:transparent;-webkit-text-stroke:1.5px #EDEDE6}
.art-in{animation:artin .55s cubic-bezier(.16,1,.3,1)}
@keyframes artin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.title-in{animation:titlein .6s cubic-bezier(.16,1,.3,1)}
@keyframes titlein{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.icon-btn{transition:background-color .2s ease}
.icon-btn:hover{background-color:#1F1F1C !important}
.play{transition:transform .2s ease}
.play:hover{transform:scale(1.04)}
@media (prefers-reduced-motion: reduce){.art-in,.title-in,.pulse{animation:none}.play:hover{transform:none}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  tracks() {
    return [
      { key: 'tide', no: '01', title: 'Glass Harbor', artist: 'MAREN HOLT', album: 'LOW TIDE ARCHIVE', dur: 302, codec: 'FLAC', bits: '24', rate: '96' },
      { key: 'copper', no: '02', title: 'Brass Lantern', artist: 'OTIS VALE QUARTET', album: 'COPPER HOURS', dur: 398, codec: 'FLAC', bits: '16', rate: '44.1' },
      { key: 'fog', no: '03', title: '晚风测绘', artist: '林汐', album: '盐与雾', dur: 227, codec: 'ALAC', bits: '24', rate: '48' }
    ];
  }
  snap() {
    const s = this.state || {};
    return {
      idx: s.idx ?? 0,
      pos: s.pos ?? 86,
      playing: s.playing ?? true,
      mode: s.mode ?? 'system',
      applying: s.applying ?? false,
      flip: s.flip ?? false
    };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.snap();
      if (!s.playing || s.applying) return;
      const t = this.tracks()[s.idx];
      if (s.pos + 1 >= t.dur) this.go(1);
      else this.setState({ pos: s.pos + 1 });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    clearTimeout(this.applyTimer);
  }
  startApply() {
    clearTimeout(this.applyTimer);
    this.applyTimer = setTimeout(() => this.setState({ applying: false }), 1400);
  }
  go(delta) {
    const s = this.snap();
    const n = this.tracks().length;
    const strict = s.mode === 'strict';
    this.setState({ idx: (s.idx + delta + n) % n, pos: 0, applying: strict, flip: !s.flip });
    if (strict) this.startApply();
  }
  setMode(mode) {
    const s = this.snap();
    if (mode === s.mode) return;
    const strict = mode === 'strict';
    this.setState({ mode: mode, applying: strict });
    if (strict) this.startApply();
    else clearTimeout(this.applyTimer);
  }
  fmt(sec) {
    const m = Math.floor(sec / 60);
    const r = sec % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  renderVals() {
    const s = this.snap();
    const list = this.tracks();
    const t = list[s.idx];
    const pct = (s.pos / t.dur) * 100;
    const state = s.mode !== 'strict' ? 'mixed' : (s.applying ? 'applying' : 'active');
    const texts = {
      mixed: 'Android 可能混音、重采样或应用系统处理。',
      applying: '正在重建 AudioTrack，核对 mixer 与路由。',
      active: 'AudioTrack、mixer 与路由一致；非外部验证。'
    };
    return {
      track: Object.assign({}, t, { isTide: t.key === 'tide', isCopper: t.key === 'copper', isFog: t.key === 'fog' }),
      queueLabel: '/ 0' + list.length,
      flipA: !s.flip,
      flipB: s.flip,
      progress: { pct: pct + '%', elapsed: this.fmt(s.pos), total: this.fmt(t.dur) },
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? '暂停' : '播放',
      togglePlay: () => this.setState({ playing: !s.playing }),
      prev: () => this.go(-1),
      next: () => this.go(1),
      isMixed: state === 'mixed',
      isApplying: state === 'applying',
      isActive: state === 'active',
      statusText: texts[state],
      modes: [{ key: 'system', label: '系统输出' }, { key: 'strict', label: '严格 USB' }].map((m) => ({
        label: m.label,
        sel: m.key === s.mode,
        bg: m.key === s.mode ? '#EDEDE6' : 'transparent',
        fg: m.key === s.mode ? '#0F0F0E' : '#BDBDB4',
        pick: () => this.setMode(m.key)
      }))
    };
  }
}
</script>
