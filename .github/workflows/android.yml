name: Android CI

on:
  push:
    branches: [master, "release/**"]
  # Stacked feature PRs need the same checks before their prerequisite is merged.
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify M4 evidence tools
        run: python3 -m unittest discover -s tools/tests -v

      # The shared unit tests run once, on the GitHub flavor. The Play flavor has no unit tests of
      # its own, so it compiles them and runs only the license catalog test, whose input is the
      # flavor's own dependency list. Lint, both APKs and both instrumentation APKs still cover it.
      - name: Verify debug and tests
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest --tests 'io.github.sumirenokai.vesqen.licenses.ThirdPartyLicensesTest' lintDebug assembleDebug assembleDeviceTest assembleDeviceTestAndroidTest --no-daemon

      - name: Assemble Profile
        run: ./gradlew assembleProfile --no-daemon

      - name: Assemble Release and the Play bundle
        run: ./gradlew assembleRelease bundlePlayRelease --no-daemon
