name: Android CI

on:
  push:
    branches: [master, "release/**"]
  # Stacked feature PRs need the same checks before their prerequisite is merged.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The same versions as usb-engine/build.gradle.kts.
      - name: Install the NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      - name: Verify the USB stream core
        run: |
          # ThreadSanitizer cannot map its shadow memory at the runner's default ASLR entropy.
          sudo sysctl -w vm.mmap_rnd_bits=28
          cmake -S usb-engine/src/main/cpp -B build/usb-core-test -DVESQEN_SANITIZE=thread
          cmake --build build/usb-core-test
          ctest --test-dir build/usb-core-test --output-on-failure

      - name: Verify M4 evidence tools
        run: python3 -m unittest discover -s tools/tests -v

      # The shared unit tests run once, on the GitHub flavor. The Play flavor has no unit tests of
      # its own, so it compiles them and runs only the license catalog test, whose input is the
      # flavor's own dependency list. Lint, both APKs and both instrumentation APKs still cover it.
      - name: Verify debug and tests
        run: ./gradlew testGithubDebugUnitTest :usb-engine:testDebugUnitTest testPlayDebugUnitTest --tests 'io.github.sumirenokai.vesqen.licenses.ThirdPartyLicensesTest' lintDebug assembleDebug assembleDeviceTest assembleDeviceTestAndroidTest --no-daemon

      - name: Assemble Profile
        run: ./gradlew assembleProfile --no-daemon

      - name: Assemble Release and the Play bundle
        run: ./gradlew assembleRelease bundlePlayRelease --no-daemon
