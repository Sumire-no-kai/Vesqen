name: GitHub APK release

on:
  push:
    branches: [master]
    paths: [version.properties]
  workflow_dispatch:
    inputs:
      source_branch:
        description: master or release/<versionName>
        required: true
        default: master
        type: string
      source_commit:
        description: Reviewed full 40-character commit SHA on that branch
        required: true
        type: string
      create_draft:
        description: Create a draft Release for device QA (never publishes)
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-apk-release
  cancel-in-progress: false

jobs:
  select:
    if: github.repository == 'Sumire-no-kai/Vesqen' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.source.outputs.build }}
      branch: ${{ steps.source.outputs.branch }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact source and require paired version increment
        id: source
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PUSH_COMMIT: ${{ github.sha }}
          INPUT_BRANCH: ${{ inputs.source_branch }}
          INPUT_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import sys
          sys.path.insert(0, 'tools')
          import github_release as release
          automatic = os.environ['EVENT'] == 'push'
          branch = 'master' if automatic else os.environ['INPUT_BRANCH']
          commit = os.environ['PUSH_COMMIT'] if automatic else os.environ['INPUT_COMMIT']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Full source SHA required')
          if branch != 'master' and not re.fullmatch(r'release/[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', branch):
              raise SystemExit('Invalid source branch')
          build = True
          if automatic:
              before = os.environ['BEFORE']
              if not re.fullmatch(r'[0-9a-f]{40}', before) or before == '0' * 40:
                  raise SystemExit('Existing master baseline required')
              old = release.run(['git', 'show', f'{before}:version.properties'])
              new = release.run(['git', 'show', f'{commit}:version.properties'])
              build = release.version_bumped(old, new)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'build={str(build).lower()}\nbranch={branch}\ncommit={commit}\n')
          PY

  build:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Validate dispatch inputs
        env:
          SOURCE_BRANCH: ${{ needs.select.outputs.branch }}
          SOURCE_COMMIT: ${{ needs.select.outputs.commit }}
        run: |
          [[ "$SOURCE_BRANCH" == master || "$SOURCE_BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select.outputs.branch }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Pin the reviewed candidate
        working-directory: source
        env:
          SOURCE_BRANCH: ${{ needs.select.outputs.branch }}
          SOURCE_COMMIT: ${{ needs.select.outputs.commit }}
        run: |
          git merge-base --is-ancestor "$SOURCE_COMMIT" "refs/remotes/origin/$SOURCE_BRANCH"
          git checkout --detach "$SOURCE_COMMIT"
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install fixed Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Verify tools and release prerequisites
        working-directory: source
        run: |
          python3 -m unittest discover -s ../control/tools/tests -p 'test_github_release.py' -v
          python3 -m unittest discover -s tools/tests -v
          ./gradlew :app:checkPrivacyPolicyFinal :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon
      - name: Prepare unsigned candidate and source record
        env:
          SOURCE_BRANCH: ${{ needs.select.outputs.branch }}
          SOURCE_COMMIT: ${{ needs.select.outputs.commit }}
        run: |
          python3 control/tools/github_release.py prepare --source source --output unsigned \
            --commit "$SOURCE_COMMIT" --branch "$SOURCE_BRANCH" --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Transfer only unsigned candidate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-candidate
          path: |
            unsigned/candidate.apk
            unsigned/candidate.json
            unsigned/release-notes.md
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [select, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-apk-signing
    steps:
      - name: Check out trusted signing tooling only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/github_release.py
          sparse-checkout-cone-mode: false
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install fixed Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Download this run's unsigned candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-candidate
          path: unsigned
      - name: Sign and verify application signing v1
        env:
          VESQEN_KEYSTORE_BASE64: ${{ secrets.VESQEN_APP_SIGNING_P12_BASE64 }}
          VESQEN_KEYSTORE_PASSWORD: ${{ secrets.VESQEN_APP_SIGNING_PASSWORD }}
          SOURCE_COMMIT: ${{ needs.select.outputs.commit }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          VESQEN_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tools/github_release.py sign --candidate unsigned --output signed \
            --commit "$SOURCE_COMMIT" --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Retain only verified public candidate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-candidate
          path: |
            signed/Vesqen-*.apk
            signed/SHA256SUMS
            signed/release-manifest.json
            signed/release-notes.md
          if-no-files-found: error
          retention-days: 30

  draft:
    if: github.event_name == 'push' || inputs.create_draft
    needs: [select, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted publication tooling only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/github_release.py
          sparse-checkout-cone-mode: false
      - name: Download this run's signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-candidate
          path: signed
      - name: Create draft without replacing tags or assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.select.outputs.commit }}
        run: |
          python3 tools/github_release.py draft --candidate signed --repository "$REPOSITORY" --commit "$SOURCE_COMMIT"
