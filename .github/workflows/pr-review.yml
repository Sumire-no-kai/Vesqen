name: PR Review

on:
  workflow_run:
    workflows: [Android CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      publish:
        description: Publish a COMMENT review (otherwise only a workflow summary)
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_run' && vars.PR_REVIEW_ENABLED == 'true' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.conclusion != 'skipped') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run executes the default branch's workflow and script. Never
      # check out PR code, install its dependencies, or consume its artifacts here.
      - name: Check out trusted review tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Review pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_REVIEW_PUBLISH: ${{ github.event_name == 'workflow_run' || inputs.publish }}
          PR_REVIEW_PROVIDER: ${{ vars.PR_REVIEW_PROVIDER || 'openai' }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL }}
          PR_REVIEW_VERIFY_PROVIDER: ${{ vars.PR_REVIEW_VERIFY_PROVIDER }}
          PR_REVIEW_VERIFY_MODEL: ${{ vars.PR_REVIEW_VERIFY_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.PR_REVIEW_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.PR_REVIEW_OPENAI_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.PR_REVIEW_ANTHROPIC_BASE_URL }}
          OPENAI_BASE_URL: ${{ secrets.PR_REVIEW_OPENAI_BASE_URL }}
        run: python3 -I tools/pr_review.py
